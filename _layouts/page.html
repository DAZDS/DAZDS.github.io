<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>
    {% if page.title %}{{ page.title }} · {% endif %}{{ site.title | default: "DAZ Consulting DS" }}
  </title>

  <meta
    name="description"
    content="{{ page.description | default: site.description | default: 'Industrial EPC advisory, project controls and OT / ICS support.' }}"
  />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
</head>

<body>
  <header class="topbar">
    <div class="container topbar__inner">

      <a class="brand" href="{{ '/' | relative_url }}" aria-label="DAZ Consulting DS — go to home">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 96 96" role="img" aria-hidden="true" focusable="false">
            <rect
              x="6"
              y="6"
              width="84"
              height="84"
              rx="6"
              fill="none"
              stroke="currentColor"
              stroke-width="4"
            />
            <text
              x="22"
              y="58"
              fill="currentColor"
              font-size="34"
              font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif"
              font-weight="700"
              text-anchor="middle"
            >D</text>
            <text
              x="48"
              y="58"
              fill="currentColor"
              font-size="34"
              font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif"
              font-weight="700"
              text-anchor="middle"
            >A</text>
            <text
              x="74"
              y="58"
              fill="currentColor"
              font-size="22"
              font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif"
              font-weight="700"
              text-anchor="middle"
            >DS</text>
          </svg>
        </span>

        <span class="brand__text">
          <span class="brand__name">DAZ Consulting DS</span>
          <span class="brand__tag">Industrial EPC Advisory · Project Controls</span>
          <span class="brand__sub">DAZ Sentinel — a division of DAZ Consulting DS</span>
        </span>
      </a>

      <nav class="nav" aria-label="Primary navigation">
        <a
          class="nav__link {% if page.url == '/' %}is-active{% endif %}"
          href="{{ '/' | relative_url }}"
        >Home</a>

        <a
          class="nav__link {% if page.url contains '/services' %}is-active{% endif %}"
          href="{{ '/services/' | relative_url }}"
        >Services</a>

        <a
          class="nav__link {% if page.url contains '/knowledge-index' %}is-active{% endif %}"
          href="{{ '/knowledge-index/' | relative_url }}"
        >Knowledge Index</a>

        <a
          class="nav__link {% if page.url contains '/contact' %}is-active{% endif %}"
          href="{{ '/contact/' | relative_url }}"
        >Contact</a>
      </nav>

      <form
        class="search"
        action="https://duckduckgo.com/"
        method="get"
        target="_blank"
        rel="noopener"
        data-site="{{ site.url | default: 'dazconsultingds.com' }}"
      >
        <label class="sr-only" for="site-search">Search</label>
        <input
          id="site-search"
          name="q"
          class="search__input"
          type="search"
          placeholder="Search…"
          autocomplete="off"
        />
        <button class="search__btn" type="submit" aria-label="Search">
          <span aria-hidden="true">⌕</span>
        </button>
      </form>

      <button
        class="burger"
        type="button"
        aria-label="Open menu"
        aria-expanded="false"
        aria-controls="primary-navigation"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

    </div>
  </header>

  <main class="main">
    <div class="container">
      {{ content }}
    </div>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <div class="footer__left">
        <div>© {{ 'now' | date: '%Y' }} DAZ Consulting DS · DAZ Sentinel</div>
      </div>
      <div class="footer__right">
        <a href="{{ '/contact/' | relative_url }}">Contact</a>
      </div>
    </div>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const burger = document.querySelector(".burger");
      const nav = document.querySelector(".nav");
      const searchForm = document.querySelector(".search");

      if (nav) {
        nav.id = "primary-navigation";
      }

      if (burger) {
        burger.addEventListener("click", function () {
          const isOpen = document.body.classList.toggle("nav-open");
          burger.setAttribute("aria-expanded", isOpen ? "true" : "false");
          burger.setAttribute("aria-label", isOpen ? "Close menu" : "Open menu");
        });
      }

      document.addEventListener("click", function (e) {
        const link = e.target.closest(".nav__link");

        if (link) {
          document.body.classList.remove("nav-open");

          if (burger) {
            burger.setAttribute("aria-expanded", "false");
            burger.setAttribute("aria-label", "Open menu");
          }
        }
      });

      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") {
          document.body.classList.remove("nav-open");

          if (burger) {
            burger.setAttribute("aria-expanded", "false");
            burger.setAttribute("aria-label", "Open menu");
          }
        }
      });

      if (searchForm) {
        searchForm.addEventListener("submit", function (e) {
          const input = searchForm.querySelector("input[name='q']");
          const site = searchForm.dataset.site || "dazconsultingds.com";
          const query = input ? input.value.trim() : "";

          if (!query) {
            e.preventDefault();
            return;
          }

          input.value = "site:" + site + " " + query;
        });
      }
    });
  </script>
</body>
</html>
